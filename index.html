<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Site</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
   
    <section>
        <nav>
            <img src="./assets/FES.svg" class="logo" alt="">
            <ul>
                <li><a href="About">about</a></li>
                <li><a href="Discord">Discord</a></li>
                <li><a href="Contact">Contact</a></li>
            </ul>
        </nav>
       
        <header>
         <div class="row">

            <div>
                <h1>Best place to learn frontend</h1>
                <p class="subheader">Go from being an absolute beginner to a pro with a simplified process</p>
                <button>Start Now!</button> 
            </div>
            <figure>
                <img src="./assets/laptop.png" alt="Home Page Image">
            </figure>
        </div>
        </header>
    </section>
   
    <main>
        <section id="About">
        <div class="section__description">  
            <h2>About</h2>
            <div>
            <p>It's a place</p>    
            </div>
            <figure class="about__img--wrapper">
                <img src="./assets/about.jpg" alt="">
            </figure>
        </div>
        </section>
       
        <section id="Discord">
            <h2>Discord</h2>
            <div>
                <p>This is the discord of the place</p>
            </div>
            <figure>
                <img src="./assets/discord.png" alt="">
            </figure>
        </section>

        <section id="Contact">
            <h2>Contact</h2>
            <form action="">
                <span>Email</span>
                <input type="text" placeholder="jerry@noname.com">
                <span>Message</span>
                <textarea type="text" placeholder="Message here"></textarea>
            </form>
        </section>
    </main>

    <footer>
        <img src="./assets/FES.svg" alt="">
        <div>
            <ol>
                <li>About</li>
                <li>Discord</li>
                <li>Contact</li>
                <li>courses</li>
            </ol>
        </div>
        <p>Copyright Me</p>
    </footer>
</body>
</html>
